<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un voyage</title>

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/template/assets/compiled/svg/favicon.svg}" type="image/x-icon">

    <!-- CSS Mazer -->
    <link rel="stylesheet" th:href="@{/template/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/template/assets/compiled/css/app-dark.css}">

    <!-- Toastify -->
    <link rel="stylesheet" th:href="@{/template/assets/extensions/toastify-js/src/toastify.css}">
</head>

<body>
    <script th:src="@{/template/assets/static/js/initTheme.js}"></script>
    <div id="app">

        <!-- Sidebar dynamique -->
        <div th:replace="fragments/sidebar :: sidebar"></div>

        <div id="main">
            <!-- Header -->
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>

            <!-- Page Heading -->
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3>Créer un voyage</h3>
                            <p class="text-subtitle text-muted">Remplissez les informations pour créer un voyage</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first text-end">
                            <a href="/voyages/list" class="btn btn-secondary">Retour à la liste</a>
                        </div>
                    </div>
                </div>

                <!-- Formulaire de création -->
                <section class="section">
                    <div class="card">
                        <div class="card-body">
                            <form id="voyage-form">
                                <div class="row mb-3">
                                    <div class="col-md-4">
                                        <label for="trajet" class="form-label">Trajet</label>
                                        <select id="trajet" class="form-select" required></select>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="chauffeur" class="form-label">Chauffeur</label>
                                        <select id="chauffeur" class="form-select" required></select>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="vehicule" class="form-label">Véhicule</label>
                                        <select id="vehicule" class="form-select" required></select>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label for="dateDepart" class="form-label">Date de départ</label>
                                        <input type="datetime-local" id="dateDepart" class="form-control" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="dateArrivee" class="form-label">Date d'arrivée</label>
                                        <input type="datetime-local" id="dateArrivee" class="form-control" required>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary">Créer le voyage</button>
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- JS Mazer -->
    <script th:src="@{/template/assets/static/js/components/dark.js}"></script>
    <script th:src="@{/template/assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
    <script th:src="@{/template/assets/compiled/js/app.js}"></script>
    <script th:src="@{/template/assets/extensions/toastify-js/src/toastify.js}"></script>

    <script>
        async function initVoyageForm() {
            // Charger les trajets
            const trajetsRes = await fetch('/api/trajets');
            const trajets = await trajetsRes.json();
            const trajetSelect = document.getElementById('trajet');
            trajets.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.idTrajet;
                opt.textContent = `${t.codeTrajet} - ${t.description}`;
                trajetSelect.appendChild(opt);
            });

            // Charger les chauffeurs
            const chauffeursRes = await fetch('/api/chauffeurs');
            const chauffeurs = await chauffeursRes.json();
            const chauffeurSelect = document.getElementById('chauffeur');
            chauffeurs.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.idChauffeur;
                opt.textContent = `${c.nom} ${c.prenom}`;
                chauffeurSelect.appendChild(opt);
            });

            // Charger les véhicules
            const vehiculesRes = await fetch('/api/vehicules');
            const vehicules = await vehiculesRes.json();
            const vehiculeSelect = document.getElementById('vehicule');
            vehicules.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.idVehicule;
                opt.textContent = `${v.immatriculation} (${v.marque || ''}) - ${v.capacitePassager} places`;
                vehiculeSelect.appendChild(opt);
            });

            // Gestion du submit
            const form = document.getElementById('voyage-form');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const data = {
                    idTrajet: parseInt(trajetSelect.value),
                    idChauffeur: parseInt(chauffeurSelect.value),
                    idVehicule: parseInt(vehiculeSelect.value),
                    dateDepart: document.getElementById('dateDepart').value,
                    dateArrivee: document.getElementById('dateArrivee').value
                };

                try {
                    const res = await fetch('/api/voyages/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (!res.ok) throw new Error('Erreur création voyage');

                    Toastify({
                        text: "Voyage créé avec succès !",
                        duration: 3000,
                        gravity: "top",
                        position: "right",
                        backgroundColor: "linear-gradient(to right, #00b09b, #96c93d)"
                    }).showToast();

                    form.reset();
                } catch (err) {
                    Toastify({
                        text: "Erreur : " + err.message,
                        duration: 4000,
                        gravity: "top",
                        position: "right",
                        backgroundColor: "linear-gradient(to right, #ff5f6d, #ffc371)"
                    }).showToast();
                    console.error(err);
                }
            });

        }

        document.addEventListener('DOMContentLoaded', initVoyageForm);
    </script>

</body>

</html>
