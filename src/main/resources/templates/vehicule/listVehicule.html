<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Véhicules</title>

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/template/assets/compiled/svg/favicon.svg}" type="image/x-icon">

    <!-- CSS Mazer -->
    <link rel="stylesheet" th:href="@{/template/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/template/assets/compiled/css/app-dark.css}">
</head>

<body>
    <script th:src="@{/template/assets/static/js/initTheme.js}"></script>

    <div id="app">
        <!-- Sidebar dynamique -->
        <div th:replace="fragments/sidebar :: sidebar"></div>

        <div id="main">
            <!-- Header -->
            <header class="mb-3">
                <a href="#" class="burger-btn d-block d-xl-none">
                    <i class="bi bi-justify fs-3"></i>
                </a>
            </header>

            <!-- Page Heading -->
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3>Gestion des Véhicules</h3>
                            <p class="text-subtitle text-muted">Liste des véhicules du système</p>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Véhicules</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <section class="section">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">Liste des Véhicules</h4>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped" id="vehiculeTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Immatriculation</th>
                                            <th>Marque</th>
                                            <th>Capacité passagers</th>
                                            <th>Détails</th>

                                        </tr>
                                    </thead>
                                    <tbody>
                                        <!-- Rempli par JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <!-- JS Mazer -->
    <script th:src="@{/template/assets/static/js/components/dark.js}"></script>
    <script th:src="@{/template/assets/extensions/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
    <script th:src="@{/template/assets/compiled/js/app.js}"></script>

    <!-- JS API -->
    <script>
        const apiUrl = '/api/vehicules';

        // Charger tous les véhicules
        async function loadVehicules() {
            try {
                const res = await fetch(apiUrl);

                if (!res.ok) {
                    alert("Erreur lors du chargement des véhicules");
                    return;
                }

                const vehicules = await res.json();

                const tbody = document.querySelector('#vehiculeTable tbody');
                tbody.innerHTML = '';

                vehicules.forEach(v => {
                    const tr = document.createElement('tr');
                 tr.innerHTML = `
    <td>${v.idVehicule}</td>
    <td>${v.immatriculation}</td>
    <td>${v.marque}</td>
    <td>${v.capacitePassager}</td>
    <td>
        <a href="/vehicules/${v.idVehicule}" class="btn btn-sm btn-primary">
            <i class="bi bi-eye"></i>
        </a>
    </td>
`;

                    tbody.appendChild(tr);
                });

            } catch (e) {
                console.error(e);
                alert("Impossible de contacter l'API");
            }
        }


        // Chargement initial
        loadVehicules();
    </script>

</body>
</html>
