<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des publicités diffusées</title>

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/template/assets/compiled/svg/favicon.svg}" type="image/x-icon">

    <!-- CSS Mazer -->
    <link rel="stylesheet" th:href="@{/template/assets/compiled/css/app.css}">
    <link rel="stylesheet" th:href="@{/template/assets/compiled/css/app-dark.css}">

    <!-- Toastify -->
    <link rel="stylesheet" th:href="@{/template/assets/extensions/toastify-js/src/toastify.css}">
</head>

<body>
<script th:src="@{/template/assets/static/js/initTheme.js}"></script>

<div id="app">

    <!-- Sidebar -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <div id="main">

        <!-- Header -->
        <header class="mb-3">
            <a href="#" class="burger-btn d-block d-xl-none">
                <i class="bi bi-justify fs-3"></i>
            </a>
        </header>

        <!-- Page Heading -->
        <div class="page-heading">
            <div class="page-title">
                <div class="row">
                    <div class="col-12 col-md-6 order-md-1 order-last">
                        <h3>Publicités diffusées</h3>
                        <p class="text-subtitle text-muted">
                            Liste de toutes les diffusions de publicités
                        </p>
                    </div>
                </div>
            </div>

            <section class="section">

                <!-- Filtre -->
                <div class="filters mb-3 d-flex align-items-center gap-2">
                    <input type="date" id="filter-date" class="form-control" placeholder="Date diffusion">

                    <select id="filter-societe" class="form-select">
                        <option value="">Toutes les sociétés</option>
                    </select>

                    <button id="filter-btn" class="btn btn-primary">Filtrer</button>
                    <button id="reset-btn" class="btn btn-secondary">Reset</button>
                </div>

                <!-- Chiffre d'affaires -->
                <div class="mt-4">
                    <h4>
                        <strong>Chiffre d'affaires : </strong>
                        <span id="ca-value">0.00</span> Ar
                    </h4>
                </div>

                <table class="table table-striped" id="table1">
                    <thead>
                        <tr>
                            <th>Société</th>
                            <th>Trajets</th>
                            <th>Date diffusion</th>
                            <th>Code pub</th>
                            <th>Coût</th>
                        </tr>
                    </thead>
                    <tbody id="diffusions-container"></tbody>
                </table>

                <!-- Reste à payer -->
                <hr class="my-4">

                <h5 class="mb-3">Reste à payer (mensuel)</h5>

                <div class="d-flex flex-wrap gap-2 align-items-end">

                    <div>
                        <label class="form-label">Mois</label>
                        <select id="rap-mois" class="form-select">
                            <option value="">-- Mois --</option>
                            <option value="1">Janvier</option>
                            <option value="2">Février</option>
                            <option value="3">Mars</option>
                            <option value="4">Avril</option>
                            <option value="5">Mai</option>
                            <option value="6">Juin</option>
                            <option value="7">Juillet</option>
                            <option value="8">Août</option>
                            <option value="9">Septembre</option>
                            <option value="10">Octobre</option>
                            <option value="11">Novembre</option>
                            <option value="12">Décembre</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Année</label>
                        <input type="number" id="rap-annee" class="form-control" placeholder="2025">
                    </div>

                    <div>
                        <label class="form-label">Société</label>
                        <select id="rap-societe" class="form-select">
                            <option value="">all</option>
                        </select>
                    </div>

                    <button id="rap-btn" class="btn btn-success">
                        Calculer
                    </button>
                </div>

                <div class="mt-3">
                    <strong>Reste à payer :</strong>
                    <span id="reste-a-payer-value" class="fw-bold text-danger">0.00</span> Ar
                </div>

            </section>
        </div>
    </div>
</div>

<!-- Toastify JS -->
<script th:src="@{/template/assets/extensions/toastify-js/src/toastify.js}"></script>

<script>
async function loadSocietes() {
    const select = document.getElementById("filter-societe");
    try {
        const res = await fetch("/api/societes");
        const societes = await res.json();
        societes.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.idSociete;
            opt.textContent = s.nom;
            select.appendChild(opt);
        });
    } catch (err) {
        showError("Erreur lors du chargement des sociétés");
    }
}

async function loadSocietesRAP() {
    const select = document.getElementById("rap-societe");
    try {
        const res = await fetch("/api/societes");
        const societes = await res.json();
        societes.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.idSociete;
            opt.textContent = s.nom;
            select.appendChild(opt);
        });
    } catch {
        showError("Erreur chargement sociétés (reste à payer)");
    }
}

async function loadDiffusions(date = "", idSociete = "") {
    const tbody = document.getElementById("diffusions-container");

    // Construire l'URL dynamiquement
    let url = "/api/publicites/diffusions";
    const params = new URLSearchParams();
    if (date) params.append("date", date);
    if (idSociete) params.append("idSociete", idSociete);
    if ([...params].length) url += "?" + params.toString();

    try {
        const res = await fetch(url);
        if (!res.ok) return showError("Erreur lors du chargement des diffusions");
        const diffusions = await res.json();

        tbody.innerHTML = "";

        if (diffusions.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">
                        Aucune diffusion trouvée
                    </td>
                </tr>
            `;
        } else {
            diffusions.forEach(d => {
                const arrets = d.voyage.trajet.arrets
                    .sort((a, b) => a.ordre - b.ordre)
                    .map(a => a.arret.nom)
                    .join(" → ");

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${d.publicite.societe.nom}</td>
                    <td>${arrets}</td>
                    <td>${formatDate(d.dateDiffusion)}</td>
                    <td>${d.publicite.code}</td>
                    <td>${d.tarifMontant ? d.tarifMontant.toFixed(2) : "N/A"}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Mettre à jour le chiffre d'affaires
        await updateCA(date, idSociete);

    } catch (err) {
        showError("Erreur lors du chargement des diffusions");
    }
}

async function updateCA(date = "", idSociete = "") {
    let url = "/api/publicites/ca";
    const params = new URLSearchParams();
    if (date) params.append("date", date);
    if (idSociete) params.append("idSociete", idSociete);
    if ([...params].length) url += "?" + params.toString();

    try {
        const res = await fetch(url);
        if (!res.ok) return showError("Erreur lors du calcul du chiffre d'affaires");
        const ca = await res.json();
        document.getElementById("ca-value").textContent = ca.toFixed(2);
    } catch (err) {
        showError("Erreur lors du calcul du chiffre d'affaires");
    }
}

async function calculerResteAPayer() {
    const mois = document.getElementById("rap-mois").value;
    const annee = document.getElementById("rap-annee").value;
    const idSociete = document.getElementById("rap-societe").value;

    if (!mois || !annee || !idSociete) {
        return showError("Veuillez remplir mois, année et société");
    }

    const url = `/api/publicites/reste?mois=${mois}&annee=${annee}&idSociete=${idSociete}`;

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error();

        const montant = await res.json();
        document.getElementById("reste-a-payer-value").textContent =
            montant.toFixed(2);

    } catch {
        showError("Erreur lors du calcul du reste à payer");
    }
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
}

function showError(msg) {
    Toastify({
        text: msg,
        duration: 4000,
        gravity: "top",
        position: "right",
        style: { background: "linear-gradient(to right, #ff5f6d, #ffc371)" },
        close: true
    }).showToast();
}

// Gestion du filtre
document.getElementById("filter-btn").addEventListener("click", () => {
    const date = document.getElementById("filter-date").value;
    const idSociete = document.getElementById("filter-societe").value;
    loadDiffusions(date, idSociete);
});

// Reset filtre
document.getElementById("reset-btn").addEventListener("click", () => {
    document.getElementById("filter-date").value = "";
    document.getElementById("filter-societe").value = "";
    loadDiffusions(); // recharge toutes les diffusions
});

// bouton calculer
document.getElementById("rap-btn")
    .addEventListener("click", calculerResteAPayer);

// Initialisation
document.addEventListener("DOMContentLoaded", async () => {
    await loadSocietes();
    await loadSocietesRAP();
    loadDiffusions();
});
</script>

</body>
</html>
